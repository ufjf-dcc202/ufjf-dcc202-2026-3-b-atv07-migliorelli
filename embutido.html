<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DCC202 CSS Embutido</title>
    <style>
      em {
        color: orange;
      }

      code {
        background-color: silver;
        border-radius: 4px;
        padding-inline: 8px;

        &:hover {
          background-color: gainsboro;
        }
      }

      dt > code {
        background-color: aquamarine;

        &:hover {
            background-color: lightgreen;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>DCC202 CSS embutido</h1>
      <p>
        você pode aplicar um estilo <em>embutido</em> usando o elemento
        <code>style</code> no <code>head</code>.
      </p>

      <dl>
        <div>
          <dt><code>color</code></dt>
          <dd>Altera a cor do texto do elemento.</dd>
        </div>
        <div>
          <dt><code>background-color</code></dt>
          <dd>Altera a cor de fundo do elemento.</dd>
        </div>
      </dl>
    </main>
  </body>
</html>
