<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Em Linha</title>
</head>
<body>
    <main>
        <h1>DCC202 CSS em linha</h1>
        <p>
            você pode aplicar um estilo <em style="color:orange">em linha</em> para um elemento usando o atributo 
            <code style="color: green; text-decoration: underline;">style</code>.
        </p>

        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>Altera a cor do texto do elemento.</dt>
            </div>
            <div>
                <dt><code>background-color</code></dt>
                <dd>Altera a cor de fundo do elemento.</dt>
            </div>
        </dl>
    </main>
</body>

</html>
